name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages
      - name: Build Pages once for testing and deployment
        env:
          PAGES_BASE_PATH: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('{0}/', steps.pages.outputs.base_path)) || '/genowrite3/' }}
        # Strict checks already ran in npm run build above.
        run: npx --no-install vite build --base="${PAGES_BASE_PATH%/}/" --outDir=dist-pages
      - uses: actions/upload-artifact@v4
        with:
          name: application-builds
          path: |
            dist/
            dist-pages/
          retention-days: 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist-pages
  browsers:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Once a required browser fails, deployment is blocked anyway.
      fail-fast: true
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Install only the required browser
        timeout-minutes: 5
        # Chromium tests are headless: skip the full desktop browser download.
        run: npx --no-install playwright install --with-deps --only-shell ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: application-builds
      - run: npm run test:browsers -- --project=${{ matrix.browser }}
      - run: npm run test:dev
        if: matrix.browser == 'chromium'
      - run: npm run test:pages -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 1
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
